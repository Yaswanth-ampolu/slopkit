<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5 Notify Launcher</title>
<style>
html,body{margin:0;min-height:100%;background:#0c0c0f;color:#ccc;font-family:Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:24px 12px}
#box{max-width:560px;width:100%;background:#141419;border:1px solid #2a2a2e;border-radius:10px;padding:18px}
h1{font-size:22px;color:#fff;margin:0 0 8px}
p{font-size:14px;line-height:1.5}
select,button,.linkbtn{font-size:16px;padding:8px 12px;margin:6px 4px 6px 0;border-radius:6px}
button,.linkbtn{background:#223146;color:#cfe3ff;border:2px solid #5e81ac;cursor:pointer;text-decoration:none;display:inline-block}
button:disabled{opacity:0.4;cursor:default}
#status{font-family:Consolas,monospace;font-size:13px;color:#8fa1b3;white-space:pre-wrap}
.note{font-size:13px;color:#e74856}
.done{font-size:13px;color:#16c60c}
</style>
</head>
<body>
<div id="box">
<p><a class="linkbtn" href="index.html">Back</a>
<a class="linkbtn" href="guide.html">Read the field guide first &rarr;</a></p>
<h1>PS5 Notify Launcher</h1>
<p>Detects firmware from User-Agent and loads supported profiles from <code>offsets.json</code> (09.00&ndash;13.60).</p>
<p class="done" id="notify-availability"></p>
<p class="note" id="notify-readiness"></p>
<p>Firmware: <select id="fw"></select>
<label>Memory: <select id="mem"><option value="512">normal (n=512)</option><option value="128" selected>low (n=128)</option><option value="64">ultra-low (n=64)</option><option value="emergency">emergency (n=32, full carrier)</option></select></label></p>
<p><button id="go" disabled>Run notify proof</button>
<button id="call" disabled>Call stub (?call=)</button>
<button id="wmap" disabled>Map readability (?wmap=1)</button></p>
<p><label>Call stub rva <input id="callrva" size="8" placeholder="1B860"></label></p>
<p><label>Sweep gadgets from <input id="wsweep" size="8" placeholder="2B00000"></label>
<button id="sweep" disabled>Sweep gadgets</button></p>
<p><label>Send findings to:
<select id="sink">
<option value="off" selected>off &mdash; screen only (safest)</option>
<option value="ntfy">ntfy.sh &mdash; no preflight, works on old WebKit</option>
<option value="db">database &mdash; needs a preflight</option>
</select></label>
<label>batch <input id="dbbatch" size="3" value="25"></label></p>
<p id="dbstat" class="note">&nbsp;</p>
<p><a class="linkbtn" href="netcheck.html">Network check</a>
<a class="linkbtn" href="autorun.html">Auto Runner (if it runs out of memory)</a>
<a class="linkbtn" href="harvest.html">Harvest what the console uploaded &rarr;</a></p>
<div id="status">loading offsets.json&hellip;</div>
</div>
<script src="neon_client.js"></script>
<script src="compatibility.js"></script>
<script>
"use strict";
const compat = window.SlopkitCompatibility;
const statusEl = document.getElementById("status");
const fwEl = document.getElementById("fw");
const goEl = document.getElementById("go");
const callEl = document.getElementById("call");
const callrvaEl = document.getElementById("callrva");
const wmapEl = document.getElementById("wmap");
const sweepEl = document.getElementById("sweep");
const wsweepEl = document.getElementById("wsweep");
const memEl = document.getElementById("mem");
const sinkEl = document.getElementById("sink");
const dbbatchEl = document.getElementById("dbbatch");
const dbstatEl = document.getElementById("dbstat");
const notifyAvailabilityEl = document.getElementById("notify-availability");
const notifyReadinessEl = document.getElementById("notify-readiness");
const OFFSETS_VERSION = "20260916";
let DATA = null;

function normFw(s) {
  const m = /^(\d+)\.(\d+)$/.exec(String(s).trim());
  if (!m) return String(s).trim();
  return m[1].padStart(2, "0") + "." + m[2];
}
function detectFw() {
  const m = /PlayStation 5\/(\d+\.\d+)/.exec(navigator.userAgent);
  return m ? normFw(m[1]) : null;
}
function setStatus(t) { statusEl.textContent = t; }

if (notifyAvailabilityEl) {
  notifyAvailabilityEl.textContent = compat.texts.notifyAvailability;
}
if (notifyReadinessEl) {
  notifyReadinessEl.textContent = compat.texts.notifyReadiness;
}

/* Probe the database before the sweep starts, so a dead upload path is found
   here rather than three minutes into a scan on the console. */
const DB_HOST = "ep-bitter-breeze-b41m27ic-pooler.c-6.us-east-2.aws.neon.tech";
const DB_DSN = "postgresql://neondb_owner:npg_fKnZ7gMLFI2i@" + DB_HOST
             + "/neondb?sslmode=require";
if (dbstatEl && typeof NeonRelay === "function") {
  dbstatEl.textContent = "database: checking\u2026";
  new NeonRelay(DB_HOST, DB_DSN).headroom(
    h => {
      dbstatEl.className = "done";
      dbstatEl.textContent = "database: reachable \u2014 "
        + (h.db_bytes / 1048576).toFixed(1) + " MiB used of "
        + (h.budget / 1048576).toFixed(0) + " MiB";
    },
    e => {
      dbstatEl.className = "note";
      dbstatEl.textContent = "database: UNREACHABLE (" + e.status + "). "
        + "Status 0 here usually means this browser blocks the CORS preflight "
        + "that the connection-string header forces \u2014 pick the ntfy.sh sink "
        + "instead, it sends no custom headers at all. "
        + "Run the network check to confirm.";
      if (sinkEl && sinkEl.value === "db") sinkEl.value = "ntfy";
    });
}

async function load() {
  try {
    const r = await fetch("offsets.json?v=" + OFFSETS_VERSION, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
  } catch (e) {
    setStatus("offsets.json load failed: " + (e.message || e));
    return;
  }
  const keys = Object.keys(DATA).sort();
  fwEl.innerHTML = "";
  for (const k of keys) {
    const o = document.createElement("option");
    o.value = k; o.textContent = k;
    fwEl.appendChild(o);
  }
  const det = detectFw();
  if (det && DATA[det]) {
    fwEl.value = det;
    setStatus("detected FW " + det + " (" + navigator.userAgent + ")\n" + keys.length + " profiles loaded.");
  } else {
    setStatus("UA firmware not detected (" + navigator.userAgent + ").\nPick manually. Loaded: " + keys.join(", "));
  }
  goEl.disabled = false;
  callEl.disabled = false;
  wmapEl.disabled = false;
  sweepEl.disabled = false;
}

function buildQuery(scan) {
  const fw = fwEl.value;
  const e = DATA && DATA[fw];
  if (!e) { setStatus("no entry for " + fw); return null; }
  const q = new URLSearchParams();
  q.set("go", "1");
  q.set("auto", "1");
  q.set("fw", fw);
  q.set("hc", (e.hc || []).join(","));
  q.set("notify", e.nt);
  q.set("gd", e.gd);
  q.set("gps", e.gps);
  q.set("gpe", e.gpe);
  q.set("cls", e.cls);
  q.set("cle", e.cle);
  q.set("ers", e.ers);
  q.set("ere", e.ere);
  if (scan) { q.set("scan", "1"); q.set("lines", "400"); }
  const sink = sinkEl ? sinkEl.value : "off";
  if (sink === "db") {
    q.set("db", "1");
    q.set("dbbatch", (dbbatchEl && dbbatchEl.value) || "25");
  } else if (sink === "ntfy") {
    q.set("sink", "ntfy");
    q.set("topic", "ps5slopkit" + fw.replace(/[^0-9]/g, ""));
    q.set("dbbatch", (dbbatchEl && dbbatchEl.value) || "25");
  }
  if (memEl) {
    if (memEl.value === "emergency") { q.set("n", "32"); }
    else if (memEl.value !== "512") { q.set("n", memEl.value); }
  }
  return q;
}

goEl.addEventListener("click", () => {
  const q = buildQuery(false);
  if (q) location.href = "notify.html?" + q.toString();
});

callEl.addEventListener("click", () => {
  const q = buildQuery(false);
  if (!q) return;
  const r = (callrvaEl.value || "1B860").trim().replace(/^0x/i, "");
  q.set("call", r);
  q.set("lines", "400");
  location.href = "notify.html?" + q.toString();
});

wmapEl.addEventListener("click", () => {
  const q = buildQuery(true);
  if (!q) return;
  q.set("wmap", "1");
  location.href = "notify.html?" + q.toString();
});

sweepEl.addEventListener("click", () => {
  const q = buildQuery(true);
  if (!q) return;
  q.set("notaska", "1");
  q.set("scanmb", "8");
  const s = (wsweepEl.value || "2B00000").trim().replace(/^0x/i, "");
  q.set("wstart", "0x" + s);
  location.href = "notify.html?" + q.toString();
});

load();
</script>
</body>
</html>
